name: Uptime-monitor

on:
  schedule:
    - cron: "3-59/10 * * * *"  # elke 10 min, op 3/13/23/.. i.p.v. de drukke :00/:10/:20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sites controleren
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Status opslaan in de repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Geen statuswijziging, niets te committen."
          else
            git commit -m "Status bijgewerkt"
            git push
          fi
