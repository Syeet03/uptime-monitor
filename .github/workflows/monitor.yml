name: Uptime monitor

on:
  schedule:
    - cron: "3-59/10 * * * *"  # every 10 min, at :03/:13/:23/.. instead of the busy :00/:10/:20
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The history is updated on every run but committed at most once an hour.
      # In between, the cache keeps the latest version.
      - name: Restore history
        uses: actions/cache@v4
        with:
          path: history.json
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Check sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save status to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          # Commit the history at most once an hour (fewer commits)
          last=$(git log -1 --format=%ct -- history.json 2>/dev/null || echo 0)
          if [ $(( $(date +%s) - ${last:-0} )) -ge 3300 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add history.json
          fi
          if git diff --cached --quiet; then
            echo "No status change, nothing to commit."
          else
            git commit -m "Update status"
            git pull --rebase --autostash || true
            git push
          fi
