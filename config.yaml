# Settings for all sites (every value can also be overridden per site)
settings:
  timeout: 15               # seconds to wait for a response
  slow_seconds: 3           # warn above this response time
  ssl_warn_days: 14         # warn when the certificate expires within this many days
  failures_before_alert: 1  # consecutive failed checks before a notification (2 = fewer false alarms)
  ntfy_server: https://ntfy.sh

# To add a site, add a block below.
sites:
  - name: RefTrack
    url: https://reftrack.nl
    keyword: RefTrack        # text that must appear on the page (case-insensitive); omit to skip this check

  - name: Wachtwoordvriend
    url: https://wachtwoordvriend.nl
    keyword: Wachtwoordvriend

  - name: lucasvanpelt.com
    url: https://lucasvanpelt.com
    keyword: Lucas van Pelt
